name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_URL: https://www.saucedemo.com
  API_BASE_URL: https://dummyjson.com
  CI: true
  ALLURE_RESULTS: true

jobs:
  test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, api]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.suite == 'ui' && 'chromium firefox webkit' || 'chromium' }}

      - name: Run UI tests
        if: matrix.suite == 'ui'
        run: npx playwright test tests/ui/ --project=chromium --project=firefox --project=webkit

      - name: Run API tests
        if: matrix.suite == 'api'
        run: npx playwright test tests/api/ --project=api

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}
          path: reports/allure-results/
          retention-days: 1

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            reports/playwright-report/
            reports/test-results.json
            reports/junit-results.xml
            reports/test-artifacts/
          retention-days: 14

  allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [test]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: reports/allure-results/
          merge-multiple: true

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Publish Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: reports/allure-report
